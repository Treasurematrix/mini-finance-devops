#Play 1 — Install Nginx
- name: Install and configure Nginx
  hosts: web
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install nginx and git
      apt:
        name:
          - nginx
          - git
        state: present

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: true

# Play 2 — Deploy Mini Finance App
- name: Deploy Mini Finance site
  hosts: web
  become: true

  tasks:
    - name: Clone repo
      git:
        repo: https://github.com/pravinmishraaws/mini_finance.git
        dest: /tmp/mini-finance

    - name: Copy site to nginx root
      copy:
        src: /tmp/mini-finance/
        dest: /var/www/html/
        remote_src: yes
      notify: Reload nginx

    - name: Set permissions
      file:
        path: /var/www/html
        owner: www-data
        group: www-data
        recurse: yes

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded


# Play 3 — Verify Deployment

- name: Verify deployment
  hosts: localhost
  connection: local

  tasks:
    - name: Check website
      uri:
        url: http://20.63.38.137
      register: result

    - name: Assert status is 200
      assert:
        that:
          - result.status == 200